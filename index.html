x;margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.glass{border:1px solid #b7d7f27a;background:linear-gradient(130deg,#5083ae5c,#082543bd 65%,#6b294066);backdrop-filter:blur(16px);color:white;border-radius:16px;box-shadow:inset 0 1px #ffffff32,0 8px 30px #0003}.season{text-decoration:none;display:block;color:white;padding:22px;text-align:left;min-height:136px;transition:.2s}.season:hover,.tile:hover{transform:translateY(-2px);border-color:#fff}.season strong{font-size:37px;letter-spacing:-1px;display:block}.season small{color:#c2d6e9;display:block;margin-top:5px}.season .arr{float:right;font-size:25px}.chip{display:inline-block;font-size:11px;padding:4px 9px;border-radius:20px;background:#ef2845;font-weight:800}.chip.arch{background:#44617d}.back{border:0;background:transparent;color:white;font-size:15px;font-weight:700;padding:8px 0}.panelTitle{font-size:32px;margin:8px 0}.subtitle{color:#b9d1e6;margin-top:0}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:135px;padding:18px;text-align:left;transition:.2s}.tile .ico{font-size:30px;display:block;margin-bottom:10px}.tile strong{font-size:17px}.tile small{display:block;color:#bcd1e5;margin-top:6px}.list{display:grid;gap:10px}.match,.team,.statrow{padding:17px;display:flex;align-items:center;justify-content:space-between;gap:10px}.match small,.team small{display:block;color:#bcd1e5;margin-top:5px}.score{font-size:22px;font-weight:900;white-space:nowrap}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tab{background:#0b2b4a;border:1px solid #466e90;color:#c9dcef;border-radius:10px;padding:10px 15px;white-space:nowrap}.tab.active{background:#ee2546;color:white;border-color:#ee2546}.tablewrap{overflow-x:auto}.stand{border-collapse:collapse;width:100%;min-width:400px}.stand th,.stand td{text-align:left;padding:13px 10px;border-bottom:1px solid #ffffff20}.stand th{color:#acc6de;font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#041a34ed;border-top:1px solid #8fb6d555;backdrop-filter:blur(18px);z-index:4}.bottom-inner{max-width:1050px;margin:auto;display:flex;justify-content:space-around;padding:10px 12px max(12px,env(safe-area-inset-bottom))}.nav{background:none;border:0;color:#9cb6cf;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-width:65px}.nav .ico{font-size:23px}.nav.on{color:#ff3655}.notice{padding:14px 17px;margin:16px 0;border-left:3px solid #ff3556;background:#102e4baa;border-radius:8px;color:#cce0f3;font-size:13px}.hidden{display:none!important}.statrow span:last-child{font-weight:900}.admin{margin-top:24px;padding:18px}.admin button{background:#e92748;border:0;color:white;border-radius:10px;padding:12px 16px;font-weight:800}.input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #6486a4;background:#0b2745;color:white}.footnote{color:#9eb5cd;font-size:12px;margin-top:26px;line-height:1.5}@media(min-width:720px){.hero{min-height:420px}.cards{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}.main{padding-left:35px;padding-right:35px}}@media(max-width:450px){.top{padding:16px}.main{padding:4px 15px 95px}.hero{min-height:360px}.hero-inner{padding:22px}.season{text-decoration:none;display:block;color:white;padding:17px;min-height:130px}.season strong{font-size:31px}.section h2{font-size:20px}.brand{font-size:19px}}

</style></head><body><div class="shell"><header class="top"><button type="button" class="brand" id="homeBrand" aria-label="HOKEJ ZZS – přejít na úvodní obrazovku">🏒 HOKEJ <b>ZZS</b></button><button class="pill" id="adminBtn">⚙ Správa</button></header><main class="main" id="app"><section class="hero"><div class="hero-inner"><div class="eyebrow">OFICIÁLNÍ APLIKACE TURNAJE</div><h1>HOKEJ <span>ZZS</span></h1><p>HOKEJOVÝ TURNAJ ZÁCHRANÁŘŮ</p></div></section><div class="section"><h2>Vyberte ročník</h2></div><div class="cards"><a class="season glass" href="#rocnik-2026"><strong>2026</strong><b>ZLÍN</b><small>Archiv turnaje</small></a><a class="season glass" href="#rocnik-2025"><strong>2025</strong><b>CHOMUTOV</b><small>Archiv turnaje</small></a></div><p class="footnote">Pokud se ročník neotevře, prohlížeč blokuje skripty lokálního náhledu. Pro plnou funkčnost bude aplikace nasazena na HTTPS adresu.</p></main></div><nav class="bottom hidden" id="bottom"><div class="bottom-inner"><button class="nav" data-page="dashboard"><span class="ico">⌂</span>Domů</button><button class="nav" data-page="matches"><span class="ico">▦</span>Zápasy</button><button class="nav" data-page="tables"><span class="ico">▥</span>Tabulky</button><button class="nav" data-page="teams"><span class="ico">♟</span>Týmy</button><button class="nav" data-page="stats"><span class="ico">★</span>Statistiky</button></div></nav><script>
const seasons=[{year:2026,city:'Zlín',status:'Archiv'},{year:2025,city:'Chomutov',status:'Archiv'}];let season=null,page='home',group='A',selectedTeam=0,selectedMatch=0;const teams=['Ústecký kraj','Karlovarský kraj','Praha','Středočeský kraj','Jihomoravský kraj','Moravskoslezský kraj','Plzeňský kraj','Liberecký kraj','Zlínský kraj','Jihočeský kraj','Pardubický kraj','Královéhradecký kraj'];const matches=[['Ústecký kraj','Karlovarský kraj','3 : 2','08:00'],['Praha','Středočeský kraj','5 : 1','08:45'],['Jihomoravský kraj','Moravskoslezský kraj','2 : 2','09:30'],['Plzeňský kraj','Liberecký kraj','— : —','10:15']];const el=document.getElementById('app');const nav=document.getElementById('bottom');function go(p){page=p;render();window.scrollTo(0,0)}function pick(y){season=seasons.find(s=>s.year===y);go('dashboard')}function back(){season=null;go('home')}function openTeam(i){selectedTeam=i;go('team-detail')}function openMatch(i){selectedMatch=i;go('match-detail')}function tile(icon,name,sub,p){return `<button class="tile glass" onclick="go('${p}')"><span class="ico">${icon}</span><strong>${name}</strong><small>${sub}</small></button>`}function render(){nav.classList.toggle('hidden',!season||page==='admin');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.page===page));let s='';if(page==='home'){s=`<section class="hero"><div class="hero-inner"><div class="eyebrow">OFICIÁLNÍ APLIKACE TURNAJE</div><h1>HOKEJ <span>ZZS</span></h1><p>HOKEJOVÝ TURNAJ ZÁCHRANÁŘŮ</p><span class="chip">VŠECHNY ROČNÍKY NA JEDNOM MÍSTĚ</span></div></section><div class="section"><h2>Vyberte ročník</h2><span class="muted">Archiv turnaje</span></div><div class="cards">${seasons.map(x=>`<button class="season glass" onclick="pick(${x.year})"><span class="arr">›</span><strong>${x.year}</strong><b>${x.city.toUpperCase()}</b><small>${x.status==='Archiv'?'Historické výsledky a statistiky':'Aktuální turnaj'}</small><span class="chip arch" style="margin-top:12px">${x.status}</span></button>`).join('')}</div><p class="footnote">Ročníky jsou v tomto prototypu pouze ukázkové. Historická data zatím nejsou propojena s webem.</p>`}else if(page==='admin'){s=`<button class="back" onclick="go('${season?'dashboard':'home'}')">← Zpět</button><h1 class="panelTitle">Administrace</h1><div class="notice">Přihlašování a ukládání dat připravíme v další fázi. Tato obrazovka zatím nic nemění.</div><div class="admin glass"><h3>Připravované funkce</h3><p>• Přihlášení vedoucích týmů a zapisovatelů</p><p>• Příprava a zveřejnění ročníku</p><p>• Soupisky a potvrzení vedoucím</p><p>• Zápisy utkání a automatické statistiky</p><p>• Ukončení a archivace ročníku</p></div>`}else{let head=`<button class="back" onclick="back()">← Všechny ročníky</button><h1 class="panelTitle">${season.year} · ${season.city}</h1><p class="subtitle">${season.status==='Archiv'?'Archivní ročník · statistický přehled':'Aktuální ročník'}</p>`;if(page==='dashboard')s=head+`<section class="hero" style="min-height:250px"><div class="hero-inner"><div class="eyebrow">HOKEJ ZZS</div><h1 style="font-size:50px">${season.year}</h1><p>${season.city.toUpperCase()}</p></div></section><div class="section"><h2>Turnajový přehled</h2></div><div class="tiles">${tile('▦','Zápasy','Rozpis a výsledky','matches')}${tile('▥','Tabulky','Skupiny a pořadí','tables')}${tile('♟','Týmy','Soupisky účastníků','teams')}${tile('★','Statistiky','Hráči a týmy','stats')}${tile('▣','Historie','Přehled ročníků','home')}${tile('ⓘ','Informace','Pravidla a kontakt','info')}</div>`;if(page==='matches')s=head+`<h2>Výsledky zápasů</h2><div class="notice">Ukázkové zápasy – nejde o skutečné výsledky ročníku ${season.year}.</div><div class="list">${matches.map(m=>`<button class="match glass clickable" onclick="openMatch(${matches.indexOf(m)})"><div><b>${m[0]}</b><small>${m[1]} · ${m[3]}</small></div><div class="score">${m[2]} ›</div></button>`).join('')}</div>`;if(page==='tables')s=head+`<h2>Tabulky</h2><div class="tabs">${['A','B','C'].map(g=>`<button class="tab ${group===g?'active':''}" onclick="group='${g}';render()">Skupina ${g}</button>`).join('')}</div><div class="notice">Ilustrační tabulka – data budou automaticky vypočtena ze zápisů utkání.</div><div class="glass tablewrap"><table class="stand"><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>Skóre</th><th>B</th></tr></thead><tbody>${teams.slice(group==='A'?0:group==='B'?4:8,group==='A'?4:group==='B'?8:12).map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td><td>0</td><td>0:0</td><td>0</td></tr>`).join('')}</tbody></table></div>`;if(page==='teams')s=head+`<h2>Účastnické týmy</h2><div class="notice">Ukázkový seznam týmů; účast každého ročníku bude nastavovat administrátor.</div><div class="list">${teams.map(t=>`<button class="team glass clickable" onclick="openTeam(${teams.indexOf(t)})"><div><b>🏒 ${t}</b><small>Detail týmu</small></div><span>›</span></button>`).join('')}</div>`;if(page==='team-detail')s=head+`<button class="back" onclick="go('teams')">← Zpět na týmy</button><section class="detail-banner glass"><div class="eyebrow">TÝM</div><h2>${teams[selectedTeam]}</h2><div class="chip arch">${season.year}</div></section><div class="tabs"><button class="tab active">Soupiska</button><button class="tab" onclick="go('stats')">Statistiky</button><button class="tab" onclick="go('matches')">Zápasy</button></div><div class="notice">Soupiska bude dostupná po vložení skutečných dat. Žádní hráči nejsou v této ukázce vymyšleni.</div>`;if(page==='match-detail'){let m=matches[selectedMatch];s=head+`<button class="back" onclick="go('matches')">← Zpět na zápasy</button><section class="detail-banner glass"><div class="eyebrow">DETAIL ZÁPASU · UKÁZKOVÁ DATA</div><p>${m[3]}</p><div class="versus"><b>${m[0]}</b><strong>${m[2]}</strong><b>${m[1]}</b></div></section><div class="tabs"><button class="tab active">Přehled</button><button class="tab" onclick="go('teams')">Soupisky</button><button class="tab" onclick="go('stats')">Statistiky</button></div><div class="notice">Události a střelci budou doplněni ze skutečného zápisu utkání.</div>`} ;if(page==='stats')s=head+`<h2>Statistiky</h2><div class="notice">Po připojení databáze zde budou skutečné statistiky hráčů a týmů, včetně historických přehledů.</div><div class="statrow glass"><span>🥇 Nejlepší střelec</span><span>—</span></div><br><div class="statrow glass"><span>🎯 Kanadské bodování</span><span>—</span></div><br><div class="statrow glass"><span>🏆 Konečné pořadí</span><span>—</span></div>`;if(page==='info')s=head+`<h2>Informace</h2><div class="glass admin"><p>Propozice, organizační informace a kontakty budou připojeny ke konkrétnímu ročníku.</p><a href="https://zzs-hokej.webnode.cz/" target="_blank" rel="noopener" style="color:#b7dcff">Otevřít současný web ↗</a></div>`}el.innerHTML=s}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));document.getElementById('adminBtn').onclick=()=>go('admin');document.getElementById('homeBrand').onclick=()=>back();render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
