</style></head><body><div class="shell"><header class="top"><button type="button" class="brand" id="homeBrand" aria-label="HOKEJ ZZS – přejít na úvodní obrazovku"><span class="brand-stack"><span>🏒 HOKEJ <b>ZZS</b></span><small>OFICIÁLNÍ APLIKACE TURNAJE</small></span></button><button class="pill" id="adminBtn">⚙ Správa</button></header><main class="main" id="app"><section class="hero home-hero"><div class="hero-inner"></div></section><div class="section"><h2>Vyberte ročník</h2></div><div class="cards"><a class="season glass" href="#rocnik-2026"><strong>2026</strong><b>ZLÍN</b><small>Archiv turnaje</small></a><a class="season glass" href="#rocnik-2025"><strong>2025</strong><b>CHOMUTOV</b><small>Archiv turnaje</small></a></div><p class="footnote">Pokud se ročník neotevře, prohlížeč blokuje skripty lokálního náhledu. Pro plnou funkčnost bude aplikace nasazena na HTTPS adresu.</p></main></div><nav class="bottom hidden" id="bottom"><div class="bottom-inner"><button class="nav" data-page="dashboard"><span class="ico">⌂</span>Domů</button><button class="nav" data-page="matches"><span class="ico">▦</span>Zápasy</button><button class="nav" data-page="tables"><span class="ico">▥</span>Tabulky</button><button class="nav" data-page="teams"><span class="ico">♟</span>Týmy</button><button class="nav" data-page="stats"><span class="ico">★</span>Statistiky</button></div></nav><script>
const seasons=[{year:2026,city:'Zlín',status:'Archiv'},{year:2025,city:'Chomutov',status:'Archiv'}];let season=null,page='home',group='A',selectedTeam=0,selectedMatch=0;const teams=['Ústecký kraj','Karlovarský kraj','Praha','Středočeský kraj','Jihomoravský kraj','Moravskoslezský kraj','Plzeňský kraj','Liberecký kraj','Zlínský kraj','Jihočeský kraj','Pardubický kraj','Královéhradecký kraj'];const matches=[['Ústecký kraj','Karlovarský kraj','3 : 2','08:00'],['Praha','Středočeský kraj','5 : 1','08:45'],['Jihomoravský kraj','Moravskoslezský kraj','2 : 2','09:30'],['Plzeňský kraj','Liberecký kraj','— : —','10:15']];
// V teto etape jde o lokalni testovaci data, nikoliv verejne sdilenou databazi.
const yearStoreKey='hokej-zzs-local-years-v1';
let customYears=[];
try{const saved=JSON.parse(localStorage.getItem(yearStoreKey)||'[]');if(Array.isArray(saved))customYears=saved.filter(x=>x&&Number.isInteger(x.year)&&typeof x.city==='string'&&['Připravuje se','Připraven','Probíhá','Archiv'].includes(x.status))}catch(e){}
let editingYear=null;
function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function allYears(){return [...customYears,...seasons.filter(s=>!customYears.some(c=>c.year===s.year))].sort((a,b)=>b.year-a.year)}
function saveYears(){try{localStorage.setItem(yearStoreKey,JSON.stringify(customYears));return true}catch(e){alert('Údaje se nepodařilo uložit do prohlížeče.');return false}}
function startYearEdit(year){editingYear=year===null?null:Number(year);go('year-form')}
function saveYearForm(event){event.preventDefault();const f=event.target;const year=Number(f.elements.namedItem('year').value);const city=f.elements.namedItem('city').value.trim();const start=f.elements.namedItem('start').value;const end=f.elements.namedItem('end').value;const status=f.elements.namedItem('status').value;
if(!Number.isInteger(year)||year<2000||year>2100||!city){alert('Vyplň rok a místo konání.');return false}
if((start&&!end)||(!start&&end)||start&&end&&end<start){alert('Zadej obě data ve správném pořadí, nebo obě ponech prázdná.');return false}
if(allYears().some(x=>x.year===year&&x.year!==editingYear)){alert('Tento ročník už existuje.');return false}
if(editingYear!==null&&editingYear!==year)customYears=customYears.filter(x=>x.year!==editingYear);
const item={year,city,start,end,status};const idx=customYears.findIndex(x=>x.year===year);if(idx>=0)customYears[idx]=item;else customYears.push(item);
if(saveYears()){editingYear=null;go('years-admin')}return false}
function renderYearsAdmin(){return `<button class="back" onclick="go('admin')">← Zpět do správy</button><h1 class="panelTitle">Správa ročníků</h1><p class="prep-intro">Založení turnaje, vícedenní termín a veřejný stav ročníku.</p><div class="notice">TESTOVACÍ REŽIM: změny vidíš pouze v tomto prohlížeči. Na ostatních telefonech se neobjeví. Bez přihlášení a databáze zde nezadávej skutečné neveřejné údaje.</div><button class="year-action" onclick="startYearEdit(null)">＋ Založit nový ročník</button><div class="year-list">${allYears().map(x=>`<section class="glass year-entry"><div class="prep-header"><strong>${x.year} · ${safeText(x.city)}</strong><span class="prep-status ${x.status==='Archiv'?'good':''}">${safeText(x.status)}</span></div><div class="prep-note">${x.start&&x.end?safeText(x.start)+' až '+safeText(x.end):'Termín zatím neurčen'}${seasons.some(s=>s.year===x.year)&&!customYears.some(c=>c.year===x.year)?' · ukázkový archiv':''}</div><button class="year-action secondary" onclick="startYearEdit(${x.year})">Upravit ročník</button></section>`).join('')}</div>`}
function renderYearForm(){const x=editingYear===null?{year:new Date().getFullYear()+1,city:'',start:'',end:'',status:'Připravuje se'}:allYears().find(x=>x.year===editingYear);if(!x)return renderYearsAdmin();return `<button class="back" onclick="go('years-admin')">← Zpět na ročníky</button><h1 class="panelTitle">${editingYear===null?'Nový ročník':'Upravit ročník '+x.year}</h1><form class="glass year-form" onsubmit="return saveYearForm(event)"><label>Rok turnaje<input name="year" type="number" min="2000" max="2100" required value="${x.year}"></label><label>Místo konání<input name="city" maxlength="100" required placeholder="Např. Klášterec nad Ohří" value="${safeText(x.city)}"></label><div class="form-row"><label>Začátek turnaje<input name="start" type="date" value="${safeText(x.start||'')}"></label><label>Konec turnaje<input name="end" type="date" value="${safeText(x.end||'')}"></label></div><label>Stav turnaje<select name="status">${['Připravuje se','Připraven','Probíhá','Archiv'].map(st=>`<option ${x.status===st?'selected':''}>${st}</option>`).join('')}</select></label><p class="year-warning">Stav „Připravuje se“ zobrazí turnaj jako první výraznou dlaždici na úvodní stránce tohoto zařízení. Po přesunu do archivu se zobrazí v historii.</p><button type="submit">Uložit ročník</button></form>`}
function renderHomeYears(){const all=allYears(),active=all.filter(x=>x.status!=='Archiv'),archives=all.filter(x=>x.status==='Archiv');return `<section class="hero home-hero"><div class="hero-inner"></div></section>${active.length?`<div class="section"><h2>Aktuální ročník</h2></div><div class="year-list">${active.map(x=>`<button class="season-current" onclick="pick(${x.year})"><span class="arr">›</span><strong>${x.year}</strong><b>${safeText(x.city||'Místo bude upřesněno')}</b><small>${x.start&&x.end?safeText(x.start)+' – '+safeText(x.end):'Termín bude upřesněn'}</small><span class="chip">${safeText(x.status)}</span></button>`).join('')}</div>`:''}<div class="section"><h2>${active.length?'Historie turnaje':'Vyberte ročník'}</h2><span class="muted">Archiv turnaje</span></div><div class="cards">${archives.map(x=>`<button class="season glass" onclick="pick(${x.year})"><span class="arr">›</span><strong>${x.year}</strong><b>${safeText(x.city.toUpperCase())}</b><small>Historické výsledky a statistiky</small><span class="chip arch" style="margin-top:12px">Archiv</span></button>`).join('')}</div><p class="footnote">Ukázková aplikace: historické výsledky zatím nejsou propojeny s AHL.cz. Nově založené ročníky se zatím ukládají pouze v tomto prohlížeči.</p>`}
const el=document.getElementById('app');const nav=document.getElementById('bottom');function go(p){page=p;render();window.scrollTo(0,0)}function pick(y){season=allYears().find(s=>s.year===y);go('dashboard')}function back(){season=null;go('home')}function openTeam(i){selectedTeam=i;go('team-detail')}function openMatch(i){selectedMatch=i;go('match-detail')}function tile(icon,name,sub,p){return `<button class="tile glass" onclick="go('${p}')"><span class="ico">${icon}</span><strong>${name}</strong><small>${sub}</small></button>`}
// Ukazkovy lokalni checklist: bez prihlaseni, databaze a sdileni mezi zarizenimi.

{group:'Základní nastavení',items:['Založit nový ročník','Potvrdit termín a místo konání','Připravit organizační informace','Zveřejnit aktuální ročník']},
{group:'Týmy a soupisky',items:['Oslovit účastnické týmy','Rozeslat vedoucím vzor soupisky','Zkontrolovat přijaté soupisky','Schválit všechny soupisky']},

{group:'Před zahájením',items:['Potvrdit zapisovatele a jejich přístupy','Zkontrolovat kontakty vedoucích týmů','Ověřit zveřejněné informace','Provést závěrečnou kontrolu turnaje']}
];

function renderPreparation(){
 const total=prepTasks.reduce((sum,g)=>sum+g.items.length,0);

 return `<button class="back" onclick="go('admin')">← Zpět do správy</button><h1 class="panelTitle">Stav přípravy turnaje</h1><p class="prep-intro">Kontrolní centrum hlavního organizátora · pracovní návrh pro příští ročník</p><section class="glass prep-panel"><div class="prep-header"><div><div class="muted">Celková připravenost</div><div class="prep-big">${pct} %</div></div><span class="prep-status ${done===total?'good':''}">${done} z ${total} úkolů</span></div><div class="prep-progress" role="progressbar" aria-label="Připravenost turnaje" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="prep-fill" style="width:${pct}%"></div></div><div class="prep-note">Zelená znamená ručně potvrzený úkol. Procenta zatím vycházejí pouze z tohoto seznamu, nikoli ze skutečných dat turnaje.</div>${groups}</section><section class="glass prep-panel"><h3>Soupisky týmů · automatická kontrola</h3><div class="prep-tip">⏳ Čeká na propojení s databází. Po zavedení týmů a schvalování soupisek se zde zobrazí počty schválených, čekajících a chybějících soupisek. Zatím je tato část pouze informační.</div></section><p class="prep-note">✓ Zaškrtnuté úkoly se ukládají jen v tomto prohlížeči na tomto zařízení. Nejsou sdílené ani zabezpečené přihlášením. Skutečnou administraci zprovozníme až s databází a oprávněními.</p>`;

function render(){nav.classList.toggle('hidden',!season||page==='admin'||page==='preparation'||page==='years-admin'||page==='year-form');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.page===page));let s='';if(page==='home'){s=renderHomeYears()}else if(page==='admin'){s=`<button class="back" onclick="go('${season?'dashboard':'home'}')">← Zpět</button><h1 class="panelTitle">Administrace</h1><div class="notice">Vývojová verze bez přihlášení. Skutečné administrátorské funkce budou později chráněné oprávněním hlavního administrátora.</div><div class="tiles admin-main-tile">${tile('☑','Stav přípravy turnaje','Kontrolní seznam a průběh příprav','preparation')}${tile('▣','Správa ročníků','Nový turnaj, termíny a stavy','years-admin')}</div><div class="admin glass"><h3>Další připravované funkce</h3><p>• Založení a zveřejnění aktuálního ročníku</p><p>• Týmy a soupisky – formulář nebo import Excelu</p><p>• Kontrola a schvalování změn soupisek</p><p>• Propojení výsledků a statistik s AHL.cz</p><p>• Uzavření a archivace ročníku</p></div>`}else if(page==='preparation'){s=renderPreparation()}else if(page==='years-admin'){s=renderYearsAdmin()}else if(page==='year-form'){s=renderYearForm()}else{let head=`<button class="back" onclick="back()">← Všechny ročníky</button><h1 class="panelTitle">${season.year} · ${season.city}</h1><p class="subtitle">${season.status==='Archiv'?'Archivní ročník · statistický přehled':'Aktuální ročník'}</p>`;if(page==='dashboard')s=head+`<section class="hero" aria-label="HOKEJ ZZS – Mezinárodní hokejový turnaj záchranářů"><div class="hero-inner"></div></section><div class="section"><h2>Turnajový přehled</h2></div><div class="tiles">${tile('▦','Zápasy','Rozpis a výsledky','matches')}${tile('▥','Tabulky','Skupiny a pořadí','tables')}${tile('♟','Týmy','Soupisky účastníků','teams')}${tile('★','Statistiky','Hráči a týmy','stats')}${tile('▣','Historie','Přehled ročníků','home')}${tile('ⓘ','Informace','Pravidla a kontakt','info')}</div>`;if(page==='matches')s=head+`<h2>Výsledky zápasů</h2><div class="notice">Ukázkové zápasy – nejde o skutečné výsledky ročníku ${season.year}.</div><div class="list">${matches.map(m=>`<button class="match glass clickable" onclick="openMatch(${matches.indexOf(m)})"><div><b>${m[0]}</b><small>${m[1]} · ${m[3]}</small></div><div class="score">${m[2]} ›</div></button>`).join('')}</div>`;if(page==='tables')s=head+`<h2>Tabulky</h2><div class="tabs">${['A','B','C'].map(g=>`<button class="tab ${group===g?'active':''}" onclick="group='${g}';render()">Skupina ${g}</button>`).join('')}</div><div class="notice">Ilustrační tabulka – data budou automaticky vypočtena ze zápisů utkání.</div><div class="glass tablewrap"><table class="stand"><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>Skóre</th><th>B</th></tr></thead><tbody>${teams.slice(group==='A'?0:group==='B'?4:8,group==='A'?4:group==='B'?8:12).map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td><td>0</td><td>0:0</td><td>0</td></tr>`).join('')}</tbody></table></div>`;if(page==='teams')s=head+`<h2>Účastnické týmy</h2><div class="notice">Ukázkový seznam týmů; účast každého ročníku bude nastavovat administrátor.</div><div class="list">${teams.map(t=>`<button class="team glass clickable" onclick="openTeam(${teams.indexOf(t)})"><div><b>🏒 ${t}</b><small>Detail týmu</small></div><span>›</span></button>`).join('')}</div>`;if(page==='team-detail')s=head+`<button class="back" onclick="go('teams')">← Zpět na týmy</button><section class="detail-banner glass"><div class="eyebrow">TÝM</div><h2>${teams[selectedTeam]}</h2><div class="chip arch">${season.year}</div></section><div class="tabs"><button class="tab active">Soupiska</button><button class="tab" onclick="go('stats')">Statistiky</button><button class="tab" onclick="go('matches')">Zápasy</button></div><div class="notice">Soupiska bude dostupná po vložení skutečných dat. Žádní hráči nejsou v této ukázce vymyšleni.</div>`;if(page==='match-detail'){let m=matches[selectedMatch];s=head+`<button class="back" onclick="go('matches')">← Zpět na zápasy</button><section class="detail-banner glass"><div class="eyebrow">DETAIL ZÁPASU · UKÁZKOVÁ DATA</div><p>${m[3]}</p><div class="versus"><b>${m[0]}</b><strong>${m[2]}</strong><b>${m[1]}</b></div></section><div class="tabs"><button class="tab active">Přehled</button><button class="tab" onclick="go('teams')">Soupisky</button><button class="tab" onclick="go('stats')">Statistiky</button></div><div class="notice">Události a střelci budou doplněni ze skutečného zápisu utkání.</div>`} ;if(page==='stats')s=head+`<h2>Statistiky</h2><div class="notice">Po připojení databáze zde budou skutečné statistiky hráčů a týmů, včetně historických přehledů.</div><div class="statrow glass"><span>🥇 Nejlepší střelec</span><span>—</span></div><br><div class="statrow glass"><span>🎯 Kanadské bodování</span><span>—</span></div><br><div class="statrow glass"><span>🏆 Konečné pořadí</span><span>—</span></div>`;if(page==='info')s=head+`<h2>Informace</h2><div class="glass admin"><p>Propozice, organizační informace a kontakty budou připojeny ke konkrétnímu ročníku.</p><a href="https://zzs-hokej.webnode.cz/" target="_blank" rel="noopener" style="color:#b7dcff">Otevřít současný web ↗</a></div>`}el.innerHTML=s}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));document.getElementById('adminBtn').onclick=()=>go('admin');document.getElementById('homeBrand').onclick=()=>back();render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script><script>
/* HOKEJ ZZS temporary mobile layout diagnostics; no storage writes */
(function(){
 const css=document.createElement('style');css.textContent=`#zzsDiag{position:fixed!important;z-index:2147483647!important;left:8px!important;right:8px!important;bottom:8px!important;max-width:calc(100vw - 16px)!important;max-height:43dvh!important;overflow:auto!important;background:#06182bf5!important;color:#fff!important;border:2px solid #ffcf64!important;border-radius:12px!important;padding:12px!important;box-shadow:0 5px 35px #000b!important;font:12px/1.4 system-ui,sans-serif!important;box-sizing:border-box!important}#zzsDiag pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;font:11px/1.45 monospace}#zzsDiag button{font:12px system-ui!important;padding:7px 10px!important;border-radius:7px!important;background:#ef3150!important;color:white!important;border:0!important;margin-right:6px!important}#zzsDiag .head{font-size:14px;font-weight:bold}`;document.head.appendChild(css);
 const box=document.createElement('aside');box.id='zzsDiag';box.innerHTML='<div class="head">🏒 Diagnostika šířky – HOKEJ ZZS</div><div style="margin-top:8px"><button id="zzsRefresh">Změřit znovu</button><button id="zzsCopy">Kopírovat výsledek</button><button id="zzsHide">Skrýt</button></div><pre id="zzsReport">Čekám na vykreslení…</pre>';

  const fmt=n=>Number(n||0).toFixed(1);
  report=`Čas: ${new Date().toLocaleTimeString('cs-CZ')}\ninnerWidth: ${window.innerWidth}px\nclientWidth: ${vw}px\nvisualViewport: ${v?fmt(v.width):'—'}px\nvisual scale: ${v?fmt(v.scale):'—'}\nHTML scrollWidth: ${document.documentElement.scrollWidth}px\nBODY scrollWidth: ${document.body.scrollWidth}px\nMeta viewport: ${document.querySelector('meta[name="viewport"]')?.content||'chybí'}\n\nPrvky přes okraj (${bad.length}${bad.length===12?'+':''}):\n`+ (bad.length?bad.map(({e,r})=>`${e.tagName.toLowerCase()}${e.id?'#'+e.id:''}${e.className&&typeof e.className==='string'?'.'+e.className.trim().replace(/\s+/g,'.'):''}\n  levý ${fmt(r.left)} / pravý ${fmt(r.right)} / šířka ${fmt(r.width)}`).join('\n'):'Žádný prvek mimo hranice clientWidth');
  document.getElementById('zzsReport').textContent=report;
 }
 document.getElementById('zzsRefresh').onclick=measure;
 document.getElementById('zzsHide').onclick=()=>box.remove();
 document.getElementById('zzsCopy').onclick=async()=>{try{await navigator.clipboard.writeText(report);alert('Výsledek zkopírován.');}catch(e){alert('Pošli prosím snímek diagnostického okna.')}};
 setTimeout(measure,150);setTimeout(measure,900);setTimeout(measure,2400);
 window.addEventListener('resize',()=>setTimeout(measure,150));
})();
