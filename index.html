</style></head><body><div class="shell"><header class="top"><button type="button" class="brand" id="homeBrand" aria-label="HOKEJ ZZS – přejít na úvodní obrazovku"><span class="brand-stack"><span>🏒 HOKEJ <b>ZZS</b></span><small>OFICIÁLNÍ APLIKACE TURNAJE</small></span></button><button class="pill" id="adminBtn">⚙ Správa</button></header><main class="main" id="app"><section class="hero home-hero"><div class="hero-inner"></div></section><div class="section"><h2>Vyberte ročník</h2></div><div class="cards"><a class="season glass" href="#rocnik-2026"><strong>2026</strong><b>ZLÍN</b><small>Archiv turnaje</small></a><a class="season glass" href="#rocnik-2025"><strong>2025</strong><b>CHOMUTOV</b><small>Archiv turnaje</small></a></div><p class="footnote">Pokud se ročník neotevře, prohlížeč blokuje skripty lokálního náhledu. Pro plnou funkčnost bude aplikace nasazena na HTTPS adresu.</p></main></div><nav class="bottom hidden" id="bottom"><div class="bottom-inner"><button class="nav" data-page="dashboard"><span class="ico">⌂</span>Domů</button><button class="nav" data-page="matches"><span class="ico">▦</span>Zápasy</button><button class="nav" data-page="tables"><span class="ico">▥</span>Tabulky</button><button class="nav" data-page="teams"><span class="ico">♟</span>Týmy</button><button class="nav" data-page="stats"><span class="ico">★</span>Statistiky</button></div></nav><script>
const seasons=[{year:2026,city:'Zlín',status:'Archiv'},{year:2025,city:'Chomutov',status:'Archiv'}];let season=null,page='home',group='A',selectedTeam=0,selectedMatch=0;const teams=['Ústecký kraj','Karlovarský kraj','Praha','Středočeský kraj','Jihomoravský kraj','Moravskoslezský kraj','Plzeňský kraj','Liberecký kraj','Zlínský kraj','Jihočeský kraj','Pardubický kraj','Královéhradecký kraj'];const matches=[['Ústecký kraj','Karlovarský kraj','3 : 2','08:00'],['Praha','Středočeský kraj','5 : 1','08:45'],['Jihomoravský kraj','Moravskoslezský kraj','2 : 2','09:30'],['Plzeňský kraj','Liberecký kraj','— : —','10:15']];const el=document.getElementById('app');const nav=document.getElementById('bottom');function go(p){page=p;render();window.scrollTo(0,0)}function pick(y){season=seasons.find(s=>s.year===y);go('dashboard')}function back(){season=null;go('home')}function openTeam(i){selectedTeam=i;go('team-detail')}function openMatch(i){selectedMatch=i;go('match-detail')}function tile(icon,name,sub,p){return `<button class="tile glass" onclick="go('${p}')"><span class="ico">${icon}</span><strong>${name}</strong><small>${sub}</small></button>`}
// Ukazkovy lokalni checklist: bez prihlaseni, databaze a sdileni mezi zarizenimi.
const prepTasks=[
{group:'Základní nastavení',items:['Založit nový ročník','Potvrdit termín a místo konání','Připravit organizační informace','Zveřejnit aktuální ročník']},
{group:'Týmy a soupisky',items:['Oslovit účastnické týmy','Rozeslat vedoucím vzor soupisky','Zkontrolovat přijaté soupisky','Schválit všechny soupisky']},
{group:'Organizace zápasů',items:['Rozdělit týmy do skupin','Připravit rozpis utkání','Ověřit přenos údajů z AHL.cz','Zkontrolovat pravidla a bodování']},
{group:'Před zahájením',items:['Potvrdit zapisovatele a jejich přístupy','Zkontrolovat kontakty vedoucích týmů','Ověřit zveřejněné informace','Provést závěrečnou kontrolu turnaje']}
];
const prepKey='hokej-zzs-prep-checklist-v1';
let prepChecked={};
try{const stored=JSON.parse(localStorage.getItem(prepKey)||'{}');if(stored&&typeof stored==='object'&&!Array.isArray(stored))prepChecked=stored}catch(e){}
function prepToggle(key,checked){prepChecked[key]=checked;try{localStorage.setItem(prepKey,JSON.stringify(prepChecked))}catch(e){}render()}
function renderPreparation(){
 const total=prepTasks.reduce((sum,g)=>sum+g.items.length,0);
 const done=prepTasks.reduce((sum,g,gi)=>sum+g.items.filter((_,i)=>prepChecked[gi+'-'+i]).length,0);
 const pct=Math.round(done/total*100);
 const groups=prepTasks.map((g,gi)=>{const finished=g.items.filter((_,i)=>prepChecked[gi+'-'+i]).length;return `<section class="prep-group"><div class="prep-header"><h3>${g.group}</h3><span class="prep-status ${finished===g.items.length?'good':''}">${finished}/${g.items.length} hotovo</span></div>${g.items.map((label,i)=>{const key=gi+'-'+i;const checked=!!prepChecked[key];return `<div class="prep-task ${checked?'done':''}"><input type="checkbox" id="prep-${key}" ${checked?'checked':''} onchange="prepToggle('${key}',this.checked)"><label for="prep-${key}">${label}</label><span class="prep-mark">${checked?'✓ Hotovo':'Čeká'}</span></div>`}).join('')}</section>`}).join('');
 return `<button class="back" onclick="go('admin')">← Zpět do správy</button><h1 class="panelTitle">Stav přípravy turnaje</h1><p class="prep-intro">Kontrolní centrum hlavního organizátora · pracovní návrh pro příští ročník</p><section class="glass prep-panel"><div class="prep-header"><div><div class="muted">Celková připravenost</div><div class="prep-big">${pct} %</div></div><span class="prep-status ${done===total?'good':''}">${done} z ${total} úkolů</span></div><div class="prep-progress" role="progressbar" aria-label="Připravenost turnaje" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="prep-fill" style="width:${pct}%"></div></div><div class="prep-note">Zelená znamená ručně potvrzený úkol. Procenta zatím vycházejí pouze z tohoto seznamu, nikoli ze skutečných dat turnaje.</div>${groups}</section><section class="glass prep-panel"><h3>Soupisky týmů · automatická kontrola</h3><div class="prep-tip">⏳ Čeká na propojení s databází. Po zavedení týmů a schvalování soupisek se zde zobrazí počty schválených, čekajících a chybějících soupisek. Zatím je tato část pouze informační.</div></section><p class="prep-note">✓ Zaškrtnuté úkoly se ukládají jen v tomto prohlížeči na tomto zařízení. Nejsou sdílené ani zabezpečené přihlášením. Skutečnou administraci zprovozníme až s databází a oprávněními.</p>`;
}
function render(){nav.classList.toggle('hidden',!season||page==='admin'||page==='preparation');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.page===page));let s='';if(page==='home'){s=`<section class="hero home-hero"><div class="hero-inner"></div></section><div class="section"><h2>Vyberte ročník</h2><span class="muted">Archiv turnaje</span></div><div class="cards">${seasons.map(x=>`<button class="season glass" onclick="pick(${x.year})"><span class="arr">›</span><strong>${x.year}</strong><b>${x.city.toUpperCase()}</b><small>${x.status==='Archiv'?'Historické výsledky a statistiky':'Aktuální turnaj'}</small><span class="chip arch" style="margin-top:12px">${x.status}</span></button>`).join('')}</div><p class="footnote">Ročníky jsou v tomto prototypu pouze ukázkové. Historická data zatím nejsou propojena s webem.</p>`}else if(page==='admin'){s=`<button class="back" onclick="go('${season?'dashboard':'home'}')">← Zpět</button><h1 class="panelTitle">Administrace</h1><div class="notice">Vývojová verze bez přihlášení. Skutečné administrátorské funkce budou později chráněné oprávněním hlavního administrátora.</div><div class="tiles admin-main-tile">${tile('☑','Stav přípravy turnaje','Kontrolní seznam a průběh příprav','preparation')}</div><div class="admin glass"><h3>Další připravované funkce</h3><p>• Založení a zveřejnění aktuálního ročníku</p><p>• Týmy a soupisky – formulář nebo import Excelu</p><p>• Kontrola a schvalování změn soupisek</p><p>• Propojení výsledků a statistik s AHL.cz</p><p>• Uzavření a archivace ročníku</p></div>`}else if(page==='preparation'){s=renderPreparation()}else{let head=`<button class="back" onclick="back()">← Všechny ročníky</button><h1 class="panelTitle">${season.year} · ${season.city}</h1><p class="subtitle">${season.status==='Archiv'?'Archivní ročník · statistický přehled':'Aktuální ročník'}</p>`;if(page==='dashboard')s=head+`<section class="hero" aria-label="HOKEJ ZZS – Mezinárodní hokejový turnaj záchranářů"><div class="hero-inner"></div></section><div class="section"><h2>Turnajový přehled</h2></div><div class="tiles">${tile('▦','Zápasy','Rozpis a výsledky','matches')}${tile('▥','Tabulky','Skupiny a pořadí','tables')}${tile('♟','Týmy','Soupisky účastníků','teams')}${tile('★','Statistiky','Hráči a týmy','stats')}${tile('▣','Historie','Přehled ročníků','home')}${tile('ⓘ','Informace','Pravidla a kontakt','info')}</div>`;if(page==='matches')s=head+`<h2>Výsledky zápasů</h2><div class="notice">Ukázkové zápasy – nejde o skutečné výsledky ročníku ${season.year}.</div><div class="list">${matches.map(m=>`<button class="match glass clickable" onclick="openMatch(${matches.indexOf(m)})"><div><b>${m[0]}</b><small>${m[1]} · ${m[3]}</small></div><div class="score">${m[2]} ›</div></button>`).join('')}</div>`;if(page==='tables')s=head+`<h2>Tabulky</h2><div class="tabs">${['A','B','C'].map(g=>`<button class="tab ${group===g?'active':''}" onclick="group='${g}';render()">Skupina ${g}</button>`).join('')}</div><div class="notice">Ilustrační tabulka – data budou automaticky vypočtena ze zápisů utkání.</div><div class="glass tablewrap"><table class="stand"><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>Skóre</th><th>B</th></tr></thead><tbody>${teams.slice(group==='A'?0:group==='B'?4:8,group==='A'?4:group==='B'?8:12).map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td><td>0</td><td>0:0</td><td>0</td></tr>`).join('')}</tbody></table></div>`;if(page==='teams')s=head+`<h2>Účastnické týmy</h2><div class="notice">Ukázkový seznam týmů; účast každého ročníku bude nastavovat administrátor.</div><div class="list">${teams.map(t=>`<button class="team glass clickable" onclick="openTeam(${teams.indexOf(t)})"><div><b>🏒 ${t}</b><small>Detail týmu</small></div><span>›</span></button>`).join('')}</div>`;if(page==='team-detail')s=head+`<button class="back" onclick="go('teams')">← Zpět na týmy</button><section class="detail-banner glass"><div class="eyebrow">TÝM</div><h2>${teams[selectedTeam]}</h2><div class="chip arch">${season.year}</div></section><div class="tabs"><button class="tab active">Soupiska</button><button class="tab" onclick="go('stats')">Statistiky</button><button class="tab" onclick="go('matches')">Zápasy</button></div><div class="notice">Soupiska bude dostupná po vložení skutečných dat. Žádní hráči nejsou v této ukázce vymyšleni.</div>`;if(page==='match-detail'){let m=matches[selectedMatch];s=head+`<button class="back" onclick="go('matches')">← Zpět na zápasy</button><section class="detail-banner glass"><div class="eyebrow">DETAIL ZÁPASU · UKÁZKOVÁ DATA</div><p>${m[3]}</p><div class="versus"><b>${m[0]}</b><strong>${m[2]}</strong><b>${m[1]}</b></div></section><div class="tabs"><button class="tab active">Přehled</button><button class="tab" onclick="go('teams')">Soupisky</button><button class="tab" onclick="go('stats')">Statistiky</button></div><div class="notice">Události a střelci budou doplněni ze skutečného zápisu utkání.</div>`} ;if(page==='stats')s=head+`<h2>Statistiky</h2><div class="notice">Po připojení databáze zde budou skutečné statistiky hráčů a týmů, včetně historických přehledů.</div><div class="statrow glass"><span>🥇 Nejlepší střelec</span><span>—</span></div><br><div class="statrow glass"><span>🎯 Kanadské bodování</span><span>—</span></div><br><div class="statrow glass"><span>🏆 Konečné pořadí</span><span>—</span></div>`;if(page==='info')s=head+`<h2>Informace</h2><div class="glass admin"><p>Propozice, organizační informace a kontakty budou připojeny ke konkrétnímu ročníku.</p><a href="https://zzs-hokej.webnode.cz/" target="_blank" rel="noopener" style="color:#b7dcff">Otevřít současný web ↗</a></div>`}el.innerHTML=s}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));document.getElementById('adminBtn').onclick=()=>go('admin');document.getElementById('homeBrand').onclick=()=>back();render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
